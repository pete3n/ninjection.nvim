name: Ninjection E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker Image
        run: |
          docker build -f ci/Dockerfile -t ninjection-test .
          docker save ninjection-test:latest -o ninjection-test.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ninjection-test-image
          path: ninjection-test.tar

  health-tests:
    needs: build-image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: ninjection-test-image
          path: .

      - name: Load Docker image
        run: docker load < ninjection-test.tar

      - name: Run health tests
        run: docker run --rm ninjection-test nvim-dev --headless -c "PlenaryBustedDirectory tests/health" -c "qa"

  nix-lua-tests:
    needs: build-image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: ninjection-test-image
          path: .

      - name: Load Docker image
        run: docker load < ninjection-test.tar

      - name: Run nix-lua tests
        run: docker run --rm ninjection-test nvim-dev --headless -c "PlenaryBustedDirectory tests/ft/nix/lua" -c "qa"

  nix-bash-tests:
    needs: build-image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: ninjection-test-image
          path: .

      - name: Load Docker image
        run: docker load < ninjection-test.tar

      - name: Run nix-bash tests
        run: docker run --rm ninjection-test nvim-dev --headless -c "PlenaryBustedDirectory tests/ft/nix/bash" -c "qa"

  nix-resolve-tests:
    needs: build-image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: ninjection-test-image
          path: .

      - name: Load Docker image
        run: docker load < ninjection-test.tar

      # The resolution engine's eval-dependent specs skip cleanly when the pinned
      # nixpkgs source is absent from the image closure (ADR-0006). Seeding that
      # source so they run offline in CI is a separately-scoped follow-up; the
      # synthesis and scope-walk specs run here today.
      - name: Run nix-resolve tests
        run: docker run --rm ninjection-test nvim-dev --headless -c "PlenaryBustedDirectory tests/ft/nix/resolve" -c "qa"

  lua-nix-tests:
    needs: build-image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: ninjection-test-image
          path: .

      - name: Load Docker image
        run: docker load < ninjection-test.tar

      - name: Run lua-nix tests
        run: docker run --rm ninjection-test nvim-dev --headless -c "PlenaryBustedDirectory tests/ft/lua/nix" -c "qa"
